<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Prenotazione</title>
  <style>
    body { font-family: Inter, sans-serif; background: #F8FAFC; color: #0F172A; margin: 0; }
    main { max-width: 480px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 8px; }
    label { display: block; margin-bottom: 8px; }
    input, button { font-size: 16px; padding: 8px 16px; border-radius: 8px; }
    button { background: #2563EB; color: #fff; border: 0; }
    [role="status"] { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Prenota uno slot</h1>
    <label for="slot">Slot</label>
    <input id="slot" name="slot" placeholder="18:00">
    <button type="button">Prenota</button>
    <p role="status">Prenotazione confermata</p>
  </main>
</body>
</html>
