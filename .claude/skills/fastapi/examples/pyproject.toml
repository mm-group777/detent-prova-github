[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto" evita di dover marcare ogni test con @pytest.mark.asyncio
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # import sorting (sostituisce isort)
    "UP",           # pyupgrade: sintassi moderna
    "B",            # bugbear: bug tipici
    "ASYNC",        # chiamate bloccanti dentro codice async
    "S",            # bandit: problemi di sicurezza
    "SIM",          # semplificazioni
]
ignore = ["B008"]  # Depends() come default e' idiomatico in FastAPI

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = ["S101"]  # assert nei test e' corretto

[tool.ruff.format]
quote-style = "double"
