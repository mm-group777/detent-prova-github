# Contratto operativo dell'intera soluzione. La Genesi lo completa e lo porta a ready.
# Il runner lo valida prima di sviluppare e usa testing.review_suite per il collaudo E2E.
schema_version: 1
status: draft

system:
  name: "detent-prova-github"
  description: Da completare durante PRD, piano e scaffold.
  criticality: standard
  data_classification: internal

# Gli environment contengono solo riferimenti ai segreti, mai credenziali reali.
# environments:
#   e2e:
#     kind: test
#     env_files: [.env.test]
#     variables: [PLAYWRIGHT_BASE_URL]
#     secrets:
#       DATABASE_URL: { source: env, reference: DATABASE_URL }
# Le source vault/AWS/GCP/Azure vengono risolte dalle rispettive CLI; field è
# opzionale. Il runner fallisce il preflight se file o riferimenti non esistono.
environments: {}

# setup prepara dipendenze, migrazioni e seed; start deve restituire il controllo
# (es. docker compose up -d); stop viene eseguito anche quando il test fallisce.
lifecycle: {}

# Un'unica topologia per frontend, backend, worker, CLI, DB, cache, code ed esterni.
# Ogni istanza interna ready ha un healthcheck. Esempio:
# instances:
#   web:
#     kind: frontend
#     technology: React
#     path: frontend
#     depends_on: [api]
#     healthcheck: { type: http, url: http://127.0.0.1:3000, expected_status: 200 }
instances: {}

# Ogni depends_on deve avere una connessione e un verify reale.
# connections:
#   - from: web
#     to: api
#     protocol: http
#     via_env: VITE_API_URL
#     verify: curl -fsS http://127.0.0.1:8000/health
connections: []

testing:
  # review_suite: e2e
  suites: {}
  #   e2e:
  #     runner: playwright
  #     command: npx playwright test --config=playwright.system.config.ts  # progetto adottato: --config=.factory/system-e2e/playwright.system.config.mjs
  #     instances: [web, api, database]
  #     environment: e2e
  #     specs: [tests/system-e2e/main-flow.spec.ts]
  #     journeys:
  #       - name: main-flow
  #         kind: system-e2e
  #         flow: FE-FLOW-001
  #         acceptance: [AC-001]
  #         operations: [createAccount]
  #         operation_statuses: { createAccount: [201] }
  #         required_inputs: [Nome, Email, Password]
  #         required_actions: [Registrati, Conferma codice]
  #         expected_outcomes: [/welcome, Account creato]
  #         spec: tests/system-e2e/main-flow.spec.ts
  #         path: [web, api, database]
  #         mocks: [] # solo adapter external dichiarati in instances
  #     timeout_seconds: 600
  #     artifacts: [.playwright/report, .playwright/results]

  # Vincoli leggibili anche dal modello; i valori sono regole concise, non segreti.
policies:
  security: []
  deployment: []
  observability: []
  operations: []

# Metadati operativi strutturati: compilali quando applicabili.
security: {}
# In ready questa sezione è obbligatoria; usa local/none quando non applicabile.
# infrastructure:
#   provider: aws
#   region: eu-central-1
#   infrastructure_as_code: { tool: terraform, path: infra }
#   container_runtime: docker
#   orchestration: kubernetes
#   networking: { ingress: nginx, tls: cert-manager, cdn: cloudfront }
#   scaling: { autoscaling: true, min_replicas: 2, max_replicas: 20, metric: cpu }
infrastructure: {}
delivery: {}
observability: {}
operations: {}
agent_policy:
  allowed_actions: [ read_repository, write_source, execute_tests ]
  forbidden_actions: [ read_secret_values, deploy_production, delete_production_data ]
